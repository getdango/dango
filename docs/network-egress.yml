# Dango network egress — all outbound connections made by the stack.
# Telemetry: each provider has its own opt-out (see each entry's `control`
# field). `dango telemetry status/on/off [--all|--provider X]`
# (dango/cli/commands/telemetry.py, added in Session D) controls telemetry
# for the components Dango configures — Dango, dbt, dlt, and Metabase — by
# writing through to each provider's own real config mechanism below. It
# does not affect, and makes no claim about, the `functional` hosts further
# down this file.
# Functional: required for operation, disclosed but not toggleable
# Verified against installed packages (dbt-core 1.11.14, dlt 1.28.1, marimo)
# 2026-09-03 — re-verified to document the weekly telemetry heartbeat (Session Q,
# PR #445) alongside the existing one-time install ping.
# Metabase's own telemetry endpoint is NOT independently source-verified in this
# session (Metabase is a Java process, not inspectable from this Python venv) —
# confirm against Metabase's own telemetry docs before relying on it publicly.

telemetry:
  - host: telemetry.getdango.dev
    provider: dango
    control: >
      `dango telemetry off --provider dango` (or `--all`), which persists
      the same "no" answer as declining the `dango init` consent prompt
      (dango/telemetry.py:set_telemetry_enabled). DO_NOT_TRACK=1 /
      DANGO_TELEMETRY=0 / `telemetry: false` in ~/.dango/config.yml also
      still suppress every ping without touching stored state
      (dango/telemetry.py:is_telemetry_enabled).
    sends: "anonymous UUID, version, OS, Python version, source type names — one install ping at
      `dango init`, plus a weekly heartbeat ping (dango/telemetry.py:heartbeat/heartbeat_job,
      registered by platform/scheduling/scheduler.py:_setup_telemetry_heartbeat as a fixed
      internal APScheduler job whenever `dango start` runs) so an active install is measurable"
  - host: fishtownanalytics.sinter-collect.com
    provider: dbt-core
    control: "DBT_SEND_ANONYMOUS_USAGE_STATS=false or DO_NOT_TRACK=1"
    sends: "OS, Python version, invocation success/duration, hashed model content (Snowplow)"
  - host: telemetry.scalevector.ai
    provider: dlt
    control: "dlthub_telemetry=false in .dlt/config.toml, or dlt --disable-telemetry"
    sends: "command names, hashed pipeline/dataset names, execution times, OS"
  - host: metabase.com
    provider: metabase
    control: >
      `dango telemetry off --provider metabase` (or `--all`), which calls
      PUT /api/setting/anon-tracking-enabled via the Metabase admin API
      (visualization/metabase.py:set_metabase_telemetry). This is Metabase's
      runtime setting key for anonymous tracking — distinct from the
      one-time `allow_tracking` field Dango already sets to false in the
      /api/setup payload when it provisions a fresh Metabase instance
      (visualization/metabase.py:setup_metabase), so tracking is off by
      default on new installs even before this command is ever run.
      Manually toggling the setting in the Metabase admin UI still works too.
    sends: "anonymous usage statistics"

functional:
  - host: extensions.duckdb.org
    reason: "DuckDB autoloads extensions on demand"
    controllable: false
  - host: hub.getdbt.com
    reason: "dbt package installation (dbt deps)"
    controllable: false
  - host: pypi.org
    reason: "dango upgrade command (cli/commands/upgrade.py) — pip resolves package metadata here"
    controllable: false
  - host: files.pythonhosted.org
    reason: >
      dango upgrade command — pip's actual wheel/sdist download target. pypi.org
      only resolves metadata; the package file itself is served from this
      separate PyPI CDN host, same redirect-style pattern as the GitHub Releases
      entries below.
    controllable: false
  - host: registry-1.docker.io
    reason: "Metabase Docker image pull on first start"
    controllable: false
  - host: github.com
    reason: >
      Two separate download paths: (1) spaCy PII model wheel on first Presidio use
      (governance/pii_detector.py, github.com/explosion/spacy-models), (2) Metabase
      DuckDB driver on `dango init` if not cached (utils/driver.py,
      github.com/motherduckdb/metabase_duckdb_driver)
    controllable: false
  - host: objects.githubusercontent.com
    reason: "GitHub Releases asset CDN — both github.com download paths above redirect here"
    controllable: false

notes:
  - "dbt and dlt telemetry env vars/config are read by their own subprocesses/library
     calls, not a separate Dango network layer. dango telemetry off --all writes
     these through to each tool's real config (dango/cli/commands/telemetry.py)."
  - "dlt's write-through (dlthub_telemetry=false in .dlt/config.toml) is a confirmed
     real no-op-when-set, not an open question. 1.0.8-V (2026-09-03) resolved this:
     for any source type that actually calls dlt.pipeline() (DLT_NATIVE and the
     generic path used by all 27+ verified/rest_api/PostgreSQL sources — everything
     except CSV/LOCAL_FILES), dlt's telemetry runtime DOES initialize on every sync
     (RunContext.runtime_config is touched, unconditionally, by
     dlt/pipeline/track.py's on_end_trace_step hook on every extract/normalize/load
     step) — this generalizes to every source type Dango has, since they all share
     the same DltPipelineRunner extract/normalize/load call path. With
     dlthub_telemetry left unset (dlt's own default = on), this test verified a real
     outbound send is attempted to telemetry.scalevector.ai. With dlthub_telemetry=false
     written to .dlt/config.toml — the exact write-through `dango telemetry off
     --provider dlt` performs — that send is confirmed suppressed (dlt's anon
     tracker never receives an endpoint to send to, verified with DNS resolution to
     telemetry.scalevector.ai blocked and asserted unreached). So: the opt-out was
     never a no-op — it correctly disables live dlt telemetry for every real source
     type Dango ships, and users who ran `dango telemetry off --all` before this was
     confirmed were, in fact, already protected. The CSV-only finding above remains
     accurate for CSV/LOCAL_FILES specifically (still the one path with nothing live
     to flip, since it never touches dlt.pipeline() at all) — see
     tests/unit/test_egress_allowlist.py's TestLiveEgressDetection class docstrings
     (both tests) for the full empirical/code-level detail on each path."
  - "Marimo update check host (marimo.io/api/oss/latest-version) is not listed above
     because it is never contacted in a Dango deployment: Dango always passes
     --skip-update-check to every Marimo process (dango/notebooks/manager.py:141),
     verified against marimo's installed source (_cli/cli.py:583, _cli/upgrade.py)."
