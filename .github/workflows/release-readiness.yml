name: Release readiness

on:
  workflow_dispatch: {}

jobs:
  clean-flow:
    name: Clean install + proxy + second-source flow
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - name: Run release-readiness integration test
        env:
          DANGO_RUN_DOCKER_TESTS: "1"
        run: pytest tests/integration/test_release_readiness.py -v
