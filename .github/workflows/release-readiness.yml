name: Release readiness

on:
  workflow_dispatch: {}

jobs:
  clean-flow:
    name: Clean install + proxy + second-source flow
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - name: Run release-readiness integration tests
        env:
          DANGO_RUN_DOCKER_TESTS: "1"
        run: >-
          pytest tests/integration/test_release_readiness.py
          tests/integration/test_docker_identity_migration.py
          tests/integration/test_legacy_metabase_migration.py
          tests/integration/test_metabase_admin_state_matrix.py -v
          -W error::pytest.PytestRemovedIn10Warning

  wheel-imports:
    name: Fresh wheel install imports every module
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Install wheel in a clean venv (no constraints, as a user would)
        run: |
          python -m venv "$RUNNER_TEMP/fresh"
          "$RUNNER_TEMP/fresh/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/fresh/bin/pip" check
      - name: Import every dango module
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/fresh/bin/python" "$GITHUB_WORKSPACE/scripts/check_wheel_imports.py"
