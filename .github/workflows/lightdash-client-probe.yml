name: Lightdash client feasibility probe

on:
  pull_request:
    branches: [v1.1.0]
    paths:
      - .github/workflows/lightdash-client-probe.yml
      - tests/integration/lightdash_probe/**

permissions:
  contents: read

concurrency:
  group: lightdash-client-feasibility
  cancel-in-progress: false

jobs:
  actual-client:
    if: >-
      github.repository == 'getdango/dango' &&
      github.event.pull_request.head.repo.full_name == 'getdango/dango' &&
      github.event.pull_request.head.ref == 'test/t44a-lightdash-ci-r08'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the pinned metadata parser
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r tests/integration/lightdash_probe/requirements.txt
      - name: Populated running smoke, disk gate, offline build and real client
        run: python tests/integration/lightdash_probe/run.py "$RUNNER_TEMP/lightdash-r08"
      - name: Publish sanitized allowlisted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightdash-client-feasibility
          path: |
            ${{ runner.temp }}/lightdash-r08/evidence/result.json
            ${{ runner.temp }}/lightdash-r08/evidence/commands.json
            ${{ runner.temp }}/lightdash-r08/evidence/package-inventory.json
            ${{ runner.temp }}/lightdash-r08/evidence/compiler.json
          if-no-files-found: error
          retention-days: 7
