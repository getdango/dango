name: T04B native workspace lifecycle

on:
  # Keep branch-update registration scoped to this task's paths and native smoke.
  push:
    branches: [feat/t04b-actor-workspaces-01]
    paths:
      - dango/storage/workspaces.py
      - dango/storage/workspace_state.py
      - dango/storage/workspace_records.py
      - dango/storage/CLAUDE.md
      - dango/operations/store.py
      - dango/operations/CLAUDE.md
      - tests/unit/test_workspaces.py
      - tests/unit/test_workspace_state.py
      - tests/unit/test_workspace_replay.py
      - tests/unit/test_operation_store_workspace.py
      - tests/unit/workspace_support.py
      - tests/integration/native_workspaces.py
      - tests/integration/workspace_cases.py
      - tests/integration/workspace_observations.py
      - .github/workflows/t04b-native-workspaces.yml

permissions:
  contents: read

concurrency:
  group: t04b-native-workspaces
  cancel-in-progress: false

jobs:
  native-smoke:
    if: github.repository == 'getdango/dango' && github.ref == 'refs/heads/feat/t04b-actor-workspaces-01'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Enforce standard task controls, populated smoke and finite workspace matrix
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          TASK_ROOT="$RUNNER_TEMP/t04b-$GITHUB_RUN_ID"
          mkdir -m700 "$TASK_ROOT"
          mkdir -m700 "$TASK_ROOT/evidence"
          printf '%s\n' "$TASK_ROOT" > "$RUNNER_TEMP/t04b-root"
          stage() {
            printf '%s\n' "$1" | tee "$TASK_ROOT/evidence/stage.txt"
            printf '%s\n' "$1" >> "$TASK_ROOT/evidence/stages.txt"
          }
          finish() {
            result=$?
            trap - EXIT
            printf '{"exit_code":%s,"last_fixed_stage":"%s"}\n' "$result" "$(cat "$TASK_ROOT/evidence/stage.txt")" > "$TASK_ROOT/evidence/execution.json"
            exit "$result"
          }
          trap finish EXIT
          stage identity
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          stage host
          test "$(uname -m)" = x86_64
          test "$(. /etc/os-release; echo "$VERSION_ID")" = 24.04
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          stage tools
          for tool in docker jq systemd-run systemctl fallocate mkfs.ext4 mount losetup findmnt; do command -v "$tool"; done
          stage docker_control_observation
          docker info --format '{"cgroup_driver":"{{.CgroupDriver}}","cgroup_version":"{{.CgroupVersion}}","storage_driver":"{{.Driver}}"}' | tee "$TASK_ROOT/evidence/docker-controls.json"
          CGROUP_DRIVER=$(jq -r .cgroup_driver "$TASK_ROOT/evidence/docker-controls.json")
          test "$(jq -r .cgroup_version "$TASK_ROOT/evidence/docker-controls.json")" = 2
          case "$CGROUP_DRIVER" in systemd|cgroupfs) ;; *) exit 1;; esac
          stage host_python
          /usr/bin/python3 --version | tee "$TASK_ROOT/evidence/host-python.txt"
          test "$(/usr/bin/python3 -c 'import sys; print(sys.version_info >= (3,12))')" = True
          stage unowned_slice_preconditions
          systemctl show -p LoadState -p ActiveState -p FragmentPath -p DropInPaths -p ControlGroup t04b.slice | tee "$TASK_ROOT/evidence/slice-before.txt"
          test ! -e /run/systemd/system/t04b.slice && test ! -L /run/systemd/system/t04b.slice
          test "$(systemctl show -p ActiveState --value t04b.slice)" = inactive
          test -z "$(systemctl show -p FragmentPath --value t04b.slice)"
          test -z "$(systemctl show -p DropInPaths --value t04b.slice)"
          prior_group=$(systemctl show -p ControlGroup --value t04b.slice)
          case "$prior_group" in ''|/t04b.slice) ;; *) exit 1;; esac
          if test -d /sys/fs/cgroup/t04b.slice; then
            test "$(awk '$1=="populated" {print $2}' /sys/fs/cgroup/t04b.slice/cgroup.events)" = 0
            test -z "$(find /sys/fs/cgroup/t04b.slice -mindepth 1 -type d -print -quit)"
          fi
          stage exclusive_slice_creation
          sudo /usr/bin/python3 -c 'import os,sys; fd=os.open("/run/systemd/system/t04b.slice",os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o644); os.write(fd,sys.stdin.buffer.read()); os.close(fd)' <<'UNIT'
          [Unit]
          Description=Bounded T04B native workspace task
          [Slice]
          CPUAccounting=yes
          MemoryAccounting=yes
          TasksAccounting=yes
          CPUQuota=400%
          MemoryMax=4831838208
          MemorySwapMax=0
          UNIT
          stat -c %d:%i /run/systemd/system/t04b.slice > "$TASK_ROOT/owns-slice"
          stage owned_slice_start
          sudo systemctl daemon-reload
          sudo systemctl start t04b.slice
          stage controller_start
          sudo systemd-run --quiet --wait --pipe --collect --unit=t04bcontroller --slice=t04b.slice \
            --property=Type=exec --setenv="TASK_ROOT=$TASK_ROOT" --setenv="SOURCE=$GITHUB_WORKSPACE" \
            --setenv="COMMIT=$GITHUB_SHA" --setenv="OWNER=t04b-$GITHUB_RUN_ID" --setenv="CGROUP_DRIVER=$CGROUP_DRIVER" \
            --setenv="EVIDENCE_UID=$(id -u)" --setenv="EVIDENCE_GID=$(id -g)" \
            /bin/bash --noprofile --norc -euo pipefail <<'CONTROLLER'
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 DOCKER_CONFIG="$TASK_ROOT/docker-config"
          stage() {
            printf '%s\n' "$1" | tee "$TASK_ROOT/evidence/stage.txt"
            printf '%s\n' "$1" >> "$TASK_ROOT/evidence/stages.txt"
          }
          stage controller_aggregate_limits
          mkdir -m700 "$DOCKER_CONFIG"
          test "$(systemctl show -p ControlGroup --value t04b.slice)" = /t04b.slice
          SLICE=/sys/fs/cgroup/t04b.slice
          case "$CGROUP_DRIVER" in
            systemd) CGROUP_PARENT=t04b.slice ;;
            cgroupfs) CGROUP_PARENT=/t04b.slice ;;
            *) exit 1 ;;
          esac
          jq -n --rawfile memory_max "$SLICE/memory.max" --rawfile swap_max "$SLICE/memory.swap.max" \
            --rawfile cpu_max "$SLICE/cpu.max" --rawfile controller_cgroup "/proc/$$/cgroup" \
            '{memory_max:$memory_max,swap_max:$swap_max,cpu_max:$cpu_max,controller_cgroup:$controller_cgroup}' \
            | tee "$TASK_ROOT/evidence/aggregate-controls.json"
          test "$(cat "$SLICE/memory.max")" = 4831838208
          test "$(cat "$SLICE/memory.swap.max")" = 0
          read -r QUOTA PERIOD < "$SLICE/cpu.max"
          test "$QUOTA" != max && test "$QUOTA" -gt 0 && test "$QUOTA" -le "$((4 * PERIOD))"
          test -f "$SLICE/memory.peak"
          grep -Fq ':/t04b.slice/' "/proc/$$/cgroup"
          stage controller_storage_preflight
          DOCKER_ROOT=$(docker info --format '{{.DockerRootDir}}')
          DRIVER=$(docker info --format '{{.Driver}}')
          case "$DRIVER" in overlay2|overlayfs) ;; *) exit 1;; esac
          BACKING_BYTES=6442450944
          IMAGE_BOUND=2688958884
          OUTSIDE_BOUND=268435456
          HEADROOM=2147483648
          TOTAL_BOUND=$((BACKING_BYTES + IMAGE_BOUND + OUTSIDE_BOUND))
          test "$TOTAL_BOUND" -le 10000000000
          CHECKOUT_BYTES=$(du -sx --block-size=1 "$SOURCE" | cut -f1)
          test "$CHECKOUT_BYTES" -lt $((128 * 1024 * 1024))
          BACKING="$TASK_ROOT/payload.ext4"
          PAYLOAD="$TASK_ROOT/payload"
          PG='' CLIENT='' LOOP=''
          NEW_IMAGES=()
          MIN_FREE=9223372036854775807
          LOOP_SAMPLED_MAX=0
          DOCKER_BEFORE=$(du -sx --block-size=1 "$DOCKER_ROOT" | cut -f1)
          free_bytes() { df --output=avail -B1 "$1" | tail -1 | tr -d ' '; }
          outside_gate() {
            local remaining=$1
            for path in "$TASK_ROOT" "$DOCKER_ROOT" /var/lib/containerd "$SOURCE"; do
              if test -e "$path"; then
                free=$(free_bytes "$path")
                test "$free" -ge "$((remaining + HEADROOM))"
                test "$free" -ge "$MIN_FREE" || MIN_FREE=$free
              fi
            done
          }
          inside_gate() {
            free=$(free_bytes "$PAYLOAD")
            test "$free" -ge "$((HEADROOM + $1))"
            test "$free" -ge "$MIN_FREE" || MIN_FREE=$free
            used=$(du -sx --block-size=1 "$PAYLOAD" | cut -f1)
            test "$used" -le 4294967296
            test "$used" -le "$LOOP_SAMPLED_MAX" || LOOP_SAMPLED_MAX=$used
            outside_gate 0
          }
          cleanup() {
            local failure=0
            set +e
            for id in "$CLIENT" "$PG"; do
              test -z "$id" && continue
              test "$(docker inspect --format '{{index .Config.Labels "t04b.owner"}}' "$id")" = "$OWNER" || { failure=1; continue; }
              docker logs "$id" > "$TASK_ROOT/container-$id.log" 2>&1
              test "$(stat -c %s "$TASK_ROOT/container-$id.log")" -le 16777216 || failure=1
              docker stop --time=10 "$id" >/dev/null
              docker rm "$id" >/dev/null || failure=1
              docker inspect "$id" >/dev/null 2>&1 && failure=1
            done
            for image in "${NEW_IMAGES[@]}"; do docker image rm "$image" >/dev/null || failure=1; done
            if mountpoint -q "$PAYLOAD"; then
              # Only fixed safe report allowlist is retained; no raw SQL, credentials or container logs.
              for report in native-result.json smoke-result.json target-import.json acquisition.json acquisition-stage.json; do
                test ! -f "$PAYLOAD/work/$report" || cp "$PAYLOAD/work/$report" "$TASK_ROOT/evidence/$report"
              done
              umount "$PAYLOAD" || failure=1
            fi
            if ! mountpoint -q "$PAYLOAD"; then
              test -z "$LOOP" || losetup -d "$LOOP" || failure=1
              if test -z "$(losetup -j "$BACKING")"; then
                test ! -f "$BACKING" || rm "$BACKING" || failure=1
              else
                failure=1
              fi
            else
              failure=1
            fi
            rm -f "$TASK_ROOT"/container-*.log
            jq -n --argjson cleanup "$failure" --argjson task_bound "$TOTAL_BOUND" \
              --argjson checkout "$CHECKOUT_BYTES" --arg driver "$DRIVER" \
              --argjson observed_min_free "$MIN_FREE" --argjson observed_payload_max "$LOOP_SAMPLED_MAX" \
              --argjson docker_before "$DOCKER_BEFORE" --argjson docker_after "$(du -sx --block-size=1 "$DOCKER_ROOT" | cut -f1)" \
              --arg memory_peak "$(cat "$SLICE/memory.peak")" --arg memory_events "$(cat "$SLICE/memory.events")" \
              --arg cpu_stat "$(cat "$SLICE/cpu.stat")" \
              '{cleanup_failure:$cleanup,projected_owned_bound:$task_bound,observed_checkout_bytes:$checkout,observed_min_free:$observed_min_free,observed_payload_sampled_max:$observed_payload_max,docker_store_before:$docker_before,docker_store_after:$docker_after,driver:$driver,aggregate_memory_peak:$memory_peak,memory_events:$memory_events,cpu_stat:$cpu_stat,infrastructure:"Existing Docker/containerd/systemd/runner/kernel overhead is outside task slice; separate process RSS samples are not a complete infrastructure memory measurement"}' \
              > "$TASK_ROOT/evidence/resources.json"
            ps -eo comm,rss | awk '$1 ~ /^(dockerd|containerd.*|systemd|Runner.Listener|Runner.Worker)$/ {print}' > "$TASK_ROOT/evidence/infrastructure-final.txt"
            chown -R "$EVIDENCE_UID:$EVIDENCE_GID" "$TASK_ROOT/evidence"
            test "$failure" = 0
          }
          trap cleanup EXIT
          ps -eo comm,rss | awk '$1 ~ /^(dockerd|containerd.*|systemd|Runner.Listener|Runner.Worker)$/ {print}' > "$TASK_ROOT/evidence/infrastructure-before.txt"
          stage disk_headroom_before_allocation
          outside_gate "$TOTAL_BOUND"
          test ! -e "$BACKING"
          (set -o noclobber; : > "$BACKING")
          fallocate -l "$BACKING_BYTES" "$BACKING"
          test "$(stat -c %s "$BACKING")" = "$BACKING_BYTES"
          test "$(( $(stat -c %b "$BACKING") * 512 ))" -ge "$BACKING_BYTES"
          stage bounded_loop_filesystem
          mkfs.ext4 -q -m0 "$BACKING"
          mkdir "$PAYLOAD"
          LOOP=$(losetup --find --show "$BACKING")
          test "$(losetup -n -O BACK-FILE "$LOOP")" = "$BACKING"
          mount -o nosuid,nodev "$LOOP" "$PAYLOAD"
          test "$(findmnt -n -o SOURCE -T "$PAYLOAD")" = "$LOOP"
          inside_gate 2147483648
          mkdir -m700 "$PAYLOAD/work" "$PAYLOAD/pgdata" "$PAYLOAD/pg-secrets" "$PAYLOAD/client-secrets" "$PAYLOAD/gate"
          /usr/bin/python3 - "$SOURCE/tests/fixtures/runtime_profiles.json" > "$PAYLOAD/image-pins.json" <<'IMAGE_PINS'
          import hashlib, json, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(raw).hexdigest() == 'b6879d50f7220b8afa1a1b6b6266e27db6c3492a8fa2bc71747656c6411af449'
          rows = {r['component']['component_id']: r for r in json.loads(raw)['artifacts']}
          images = {}
          for name in ('node', 'postgres'):
              row = rows['t44a-image-' + name]
              images[name] = {
                  'ref': row['component']['artifact_ref'],
                  'config': row['native_hashes']['config'],
                  'diff_ids': [value for key, value in row['native_hashes'].items() if key != 'config'],
              }
          print(json.dumps(images))
          IMAGE_PINS
          stage pinned_images_acquisition
          for role in node postgres; do
            image=$(jq -r ".$role.ref" "$PAYLOAD/image-pins.json")
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              outside_gate "$IMAGE_BOUND"
              NEW_IMAGES+=("$image")
              printf '%s\n' "$image" >> "$TASK_ROOT/new-images"
              docker pull --platform=linux/amd64 "$image" >/dev/null
            fi
            docker image inspect "$image" > "$PAYLOAD/image-$role.json"
            jq -e --arg role "$role" --slurpfile pins "$PAYLOAD/image-pins.json" \
              '.[0] as $i | $pins[0][$role] as $p | $i.Os=="linux" and $i.Architecture=="amd64" and $i.RootFS.Layers==$p.diff_ids and ($i.Id==$p.config or ($i.Id==($p.ref|split("@")[1]) and $i.Descriptor.digest==($p.ref|split("@")[1]))) and ($i.RepoDigests|index($p.ref)!=null)' \
              "$PAYLOAD/image-$role.json" >/dev/null
          done
          inside_gate 2147483648
          # Seventeen-wheel actual-import closure including package initializers; data only, independently hash-checked.
          cat > "$PAYLOAD/import-pins.json" <<'IMPORT_PINS'
          [
            [
              "pydantic-2.12.4-py3-none-any.whl",
              "https://files.pythonhosted.org/packages/82/2f/e68750da9b04856e2a7ec56fc6f034a5a79775e9b9a81882252789873798/pydantic-2.12.4-py3-none-any.whl",
              "92d3d202a745d46f9be6df459ac5a064fdaa3c1c4cd8adcfa332ccf3c05f871e",
              463400
            ],
            [
