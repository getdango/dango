          IMPORT_PINS
          stage pinned_artifacts_acquisition
          /usr/bin/python3 "$SOURCE/tests/integration/native_catalog_bindings.py" --acquire "$PAYLOAD"
          export PAYLOAD
          /usr/bin/python3 - <<'PY'
          import json, os, secrets
          from pathlib import Path
          root = Path(os.environ['PAYLOAD'])
          admin, writer, writer_b = secrets.token_hex(32), secrets.token_hex(32), secrets.token_hex(32)
          values = {
              'pg-secrets/admin': (admin, 999),
              'pg-secrets/pgpass': ('*:*:*:postgres:' + admin + '\n', 999),
              'pg-secrets/setup.sql': ("CREATE ROLE t04b_writer LOGIN PASSWORD '" + writer + "' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;\nCREATE DATABASE t04a_catalog;\nGRANT CONNECT,CREATE ON DATABASE t04a_catalog TO t04b_writer;\nCREATE ROLE t04b_writer_b LOGIN PASSWORD '" + writer_b + "' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;\nGRANT CONNECT,CREATE ON DATABASE t04a_catalog TO t04b_writer_b;\n", 999),
              'client-secrets/catalog.json': (json.dumps(dict(host='127.0.0.1',port='5432',dbname='t04a_catalog',user='t04b_writer',password=writer)), 501),
              'client-secrets/catalog-b.json': (json.dumps(dict(host='127.0.0.1',port='5432',dbname='t04a_catalog',user='t04b_writer_b',password=writer_b)), 501),
          }
          for name, (value, uid) in values.items():
              path = root / name
              path.write_text(value)
              path.chmod(0o600)
              os.chown(path, uid, 999 if uid == 999 else 20)
          PY
          chown -R 999:999 "$PAYLOAD/pgdata" "$PAYLOAD/pg-secrets"
          chown -R 501:20 "$PAYLOAD/work" "$PAYLOAD/client-secrets"
          chmod 755 "$PAYLOAD/gate"
          PG_IMAGE=$(jq -r '.postgres.ref' "$PAYLOAD/image-pins.json")
          CLIENT_IMAGE=$(jq -r '.node.ref' "$PAYLOAD/image-pins.json")
          stage waiting_containers_creation
          common=(--platform=linux/amd64 --cgroup-parent="$CGROUP_PARENT" --read-only --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=128 --log-driver=json-file --log-opt=max-size=8m --log-opt=max-file=1 --tmpfs=/tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777 --label="t04b.owner=$OWNER")
          PG=$(docker create "${common[@]}" --name "$OWNER-pg" --user=999:999 --cpus=1 --memory=805306368 --memory-swap=805306368 --network=none \
            --tmpfs=/var/run/postgresql:rw,noexec,nosuid,nodev,size=16777216,uid=999,gid=999 \
            --mount="type=bind,src=$PAYLOAD/pgdata,dst=/var/lib/postgresql/data" \
            --mount="type=bind,src=$PAYLOAD/pg-secrets,dst=/secrets,readonly" \
            --mount="type=bind,src=$PAYLOAD/gate,dst=/gate,readonly" \
            --env=POSTGRES_PASSWORD_FILE=/secrets/admin --env=POSTGRES_DB=postgres \
            '--env=POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256' --env=PGPASSFILE=/secrets/pgpass \
            --entrypoint=/bin/sh "$PG_IMAGE" -c 'while [ ! -f /gate/pg ]; do sleep .1; done; exec /usr/local/bin/docker-entrypoint.sh postgres -c shared_buffers=128MB -c max_wal_size=64MB -c log_min_error_statement=panic -c log_statement=none')
          CLIENT=$(docker create "${common[@]}" --name "$OWNER-client" --user=501:20 --cpus=3 --memory=3221225472 --memory-swap=3221225472 --network="container:$PG" \
            --mount="type=bind,src=$PAYLOAD/tools,dst=/tools,readonly" --mount="type=bind,src=$SOURCE,dst=/source,readonly" \
            --mount="type=bind,src=$PAYLOAD/work,dst=/work" --mount="type=bind,src=$PAYLOAD/client-secrets,dst=/secrets,readonly" \
            --mount="type=bind,src=$PAYLOAD/gate,dst=/gate,readonly" \
            --env=HOME=/work --env=TMPDIR=/work/tmp --env=PYTHONDONTWRITEBYTECODE=1 --env=PYTHONPATH=/work/site:/source \
            --env=AWS_EC2_METADATA_DISABLED=true --env=GCE_METADATA_DISABLED=true --env="TASK_COMMIT=$COMMIT" --workdir=/work \
            --entrypoint=/bin/sh "$CLIENT_IMAGE" -ec 'while [ ! -f /gate/import ]; do sleep .1; done; mkdir /work/tmp; /tools/python/bin/python3.14 -m pip install --no-index --no-deps --no-cache-dir --no-compile --target /work/site /tools/artifacts/*.whl > /work/install.log 2>&1; /tools/python/bin/python3.14 -m pip check > /work/dependency-check.log 2>&1; /tools/python/bin/python3.14 /source/tests/integration/native_workspaces.py --check-imports /work/import-project > /work/import.log 2>&1; touch /work/import-ok; while [ ! -f /gate/client ]; do sleep .1; done; exec /tools/python/bin/python3.14 /source/tests/integration/native_workspaces.py --task-root /work/task --commit "$TASK_COMMIT" --phase affected')
          inspect_limits() {
            local id=$1 memory=$2 cpus=$3 user=$4 network=$5
            local image=$CLIENT_IMAGE
            test "$user" != 999:999 || image=$PG_IMAGE
            docker inspect "$id" | jq -e --arg owner "$OWNER" --arg user "$user" --arg network "$network" --argjson memory "$memory" --argjson cpus "$cpus" --arg parent "$CGROUP_PARENT" --arg image "$image" --arg image_id "$(docker image inspect --format '{{.Id}}' "$image")" \
              '.[0] | .HostConfig as $h | .State.Running==false and .Config.Image==$image and .Image==$image_id and .Config.User==$user and .Config.Labels["t04b.owner"]==$owner and $h.CgroupParent==$parent and $h.Memory==$memory and $h.MemorySwap==$memory and $h.NanoCpus==$cpus and $h.ReadonlyRootfs and ($h.Privileged|not) and ($h.CapAdd|length)==0 and $h.CapDrop==["ALL"] and $h.SecurityOpt==["no-new-privileges:true"] and $h.PidsLimit==128 and $h.NetworkMode==$network and ($h.PortBindings|length)==0 and ($h.Devices|length)==0 and $h.LogConfig=={"Type":"json-file","Config":{"max-size":"8m","max-file":"1"}}' >/dev/null
            docker inspect "$id" | jq -e --arg payload "$PAYLOAD" --arg source "$SOURCE" --arg user "$user" \
              '.[0] | .HostConfig as $h | ($h.PidMode=="" and $h.IpcMode=="private") and
              (if $user=="999:999" then
                $h.Tmpfs=={"/tmp":"rw,noexec,nosuid,nodev,size=67108864,mode=1777","/var/run/postgresql":"rw,noexec,nosuid,nodev,size=16777216,uid=999,gid=999"} and
                ((.Mounts|map([.Source,.Destination,.RW])|sort)==([[$payload+"/pgdata","/var/lib/postgresql/data",true],[$payload+"/pg-secrets","/secrets",false],[$payload+"/gate","/gate",false]]|sort))
              else
                $h.Tmpfs=={"/tmp":"rw,noexec,nosuid,nodev,size=67108864,mode=1777"} and
                ((.Mounts|map([.Source,.Destination,.RW])|sort)==([[$payload+"/tools","/tools",false],[$source,"/source",false],[$payload+"/work","/work",true],[$payload+"/client-secrets","/secrets",false],[$payload+"/gate","/gate",false]]|sort))
              end)' >/dev/null
          }
          stage waiting_containers_config_verification
          inspect_limits "$PG" 805306368 1000000000 999:999 none
          inspect_limits "$CLIENT" 3221225472 3000000000 501:20 "container:$PG"
          stage waiting_containers_actual_placement
          for id in "$PG" "$CLIENT"; do
            docker start "$id" >/dev/null
            pid=$(docker inspect --format '{{.State.Pid}}' "$id")
            test "$pid" -gt 0
            case "$CGROUP_DRIVER" in
              systemd) expected="0::/t04b.slice/docker-$id.scope" ;;
              cgroupfs) expected="0::/t04b.slice/$id" ;;
            esac
            grep -Fxq "$expected" "/proc/$pid/cgroup"
            printf '%s\n' "$expected" >> "$TASK_ROOT/evidence/container-placement.txt"
          done
          test "$(cat "$SLICE/memory.swap.current")" = 0
          inside_gate 1610612736
          stage exact_target_guarded_import_bootstrap
          touch "$PAYLOAD/gate/import"
          imported=0
          for _ in $(seq 1 120); do
            if test -f "$PAYLOAD/work/import-ok"; then imported=1; break; fi
            test "$(docker inspect --format '{{.State.Running}}' "$CLIENT")" = true || break
            sleep 1
          done
          test "$imported" = 1
          jq -e '.status=="PASS" and .python=="3.14.10" and .duckdb=="2.0.0" and .temporary_sqlite_bootstrap==true and .native_services_started==false' "$PAYLOAD/work/target-import.json" >/dev/null
          stage ordinary_role_bootstrap
          touch "$PAYLOAD/gate/pg"
          ready=0
          for _ in $(seq 1 120); do
            if docker exec "$PG" pg_isready -q; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker exec "$PG" psql -w -U postgres -d postgres -v ON_ERROR_STOP=1 -f /secrets/setup.sql > "$PAYLOAD/work/bootstrap.log" 2>&1
          rm "$PAYLOAD/pg-secrets/setup.sql"
          inside_gate 1073741824
          stage actual_adapter_smoke
          touch "$PAYLOAD/gate/client"
          test "$(docker wait "$CLIENT")" = 0
          stage final_resource_and_native_receipt
          test "$(awk '$1=="oom_kill" {print $2}' "$SLICE/memory.events")" = 0
          test "$(cat "$SLICE/memory.swap.current")" = 0
          inside_gate 0
          jq -e --arg commit "$COMMIT" '.status=="PASS_NATIVE_WORKSPACE_SMOKE" and .commit==$commit and .owned_cleanup==true' "$PAYLOAD/work/smoke-result.json"
          jq -e --arg commit "$COMMIT" '
            .status=="PASS_NATIVE_WORKSPACE_AFFECTED" and .phase=="affected" and .commit==$commit
            and .selected_cases==["08","12","16","18"]
            and (.cases|keys)==["01","02","03","04","05","06","07","08","09","10","11","12","13","14","15","16","17","18"]
            and (.cases|to_entries|all(if (.key|IN("08","12","16","18")) then .value=="PASS" else .value=="UNRUN" end))
            and .retained_evidence.head=="f01d88b059c5e5de1e774372f85a72697fa35c74"
            and .retained_evidence.run=="45673095810"
            and (.retained_evidence.cases|keys)==["01","02","03","04","05","06","07","08","09","10","11","12","13","14","15","16","17","18"]
            and (.retained_evidence.cases|all(.=="PASS"))
            and .retained_affected_evidence.head=="b2c181653ee371e553c24eaaabd0bce486009b97"
            and .retained_affected_evidence.run=="45728157345"
            and (.retained_affected_evidence.cases|keys)==["01","02","03","04","05","06","07","08","09","10","11","12","13","14","15","16","17","18"]
            and (.retained_affected_evidence.cases|to_entries|all(if (.key|IN("08","09","12","14","16","17","18")) then .value=="PASS" else .value=="UNRUN" end))
          ' "$PAYLOAD/work/native-result.json" >/dev/null
          stage completed_native_affected
          CONTROLLER
      - name: Verify owned cleanup and remove the task slice
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/t04b-root"; then
            TASK_ROOT=$(cat "$RUNNER_TEMP/t04b-root")
            test "$TASK_ROOT" = "$RUNNER_TEMP/t04b-$GITHUB_RUN_ID"
            cleanup_stage=unowned_slice_untouched
            cleanup_finish() {
              result=$?
              trap - EXIT
              printf '{"exit_code":%s,"last_fixed_stage":"%s"}\n' "$result" "$cleanup_stage" > "$TASK_ROOT/evidence/cleanup-execution.json"
              exit "$result"
            }
            trap cleanup_finish EXIT
            if test -f "$TASK_ROOT/owns-slice"; then
              cleanup_stage=owned_slice_cleanup
              test -f /run/systemd/system/t04b.slice
              test "$(stat -c %d:%i /run/systemd/system/t04b.slice)" = "$(cat "$TASK_ROOT/owns-slice")"
              sudo systemd-run --quiet --wait --pipe --collect --unit=t04bcleanup --slice=t04b.slice \
                --property=Type=exec --setenv="TASK_ROOT=$TASK_ROOT" --setenv="OWNER=t04b-$GITHUB_RUN_ID" \
                --setenv="EVIDENCE_UID=$(id -u)" --setenv="EVIDENCE_GID=$(id -g)" \
                /bin/bash --noprofile --norc -euo pipefail <<'CLEANUP'
              export PATH=/usr/sbin:/usr/bin:/sbin:/bin DOCKER_CONFIG="$TASK_ROOT/docker-config"
              remaining=$(docker ps -aq --filter "label=t04b.owner=$OWNER")
              for id in $remaining; do
                test "$(docker inspect --format '{{index .Config.Labels "t04b.owner"}}' "$id")" = "$OWNER"
                case "$(docker inspect --format '{{.Name}}' "$id")" in "/$OWNER-pg"|"/$OWNER-client") ;; *) exit 1;; esac
                docker stop --time=10 "$id" >/dev/null
                docker rm "$id" >/dev/null
              done
              if test -f "$TASK_ROOT/new-images"; then
                while read -r image; do
                  if docker image inspect "$image" >/dev/null 2>&1; then docker image rm "$image" >/dev/null; fi
                done < "$TASK_ROOT/new-images"
              fi
              backing="$TASK_ROOT/payload.ext4"
              payload="$TASK_ROOT/payload"
              loop=$(losetup -j "$backing" -n -O NAME)
              if mountpoint -q "$payload"; then
                test -n "$loop" && test "$(findmnt -n -o SOURCE -T "$payload")" = "$loop"
                mkdir -p "$TASK_ROOT/evidence"
                for report in native-result.json smoke-result.json target-import.json acquisition.json acquisition-stage.json; do
                  test ! -f "$payload/work/$report" || cp "$payload/work/$report" "$TASK_ROOT/evidence/$report"
                done
                umount "$payload"
              fi
              test -z "$loop" || losetup -d "$loop"
              test -z "$(losetup -j "$backing")"
              if test -e "$backing"; then
                test -f "$backing" && test ! -L "$backing" && test "$(stat -c %u "$backing")" = 0
                rm "$backing"
              fi
              test -z "$(docker ps -aq --filter "label=t04b.owner=$OWNER")"
              mkdir -p "$TASK_ROOT/evidence"
              printf '%s\n' '{"owned_containers_absent":true,"owned_loop_absent":true,"owned_backing_absent":true,"verified":true}' > "$TASK_ROOT/evidence/final-cleanup.json"
              chown -R "$EVIDENCE_UID:$EVIDENCE_GID" "$TASK_ROOT/evidence"
          CLEANUP
              cleanup_stage=owned_slice_removal
              sudo systemctl stop t04b.slice
              sudo rm /run/systemd/system/t04b.slice
              sudo systemctl daemon-reload
              cleanup_stage=owned_cleanup_completed
            fi
          fi
      - name: Retain bounded sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t04b-native-smoke
          path: ${{ runner.temp }}/t04b-*/evidence/*
          retention-days: 7
          if-no-files-found: error
