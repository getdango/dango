name: Platform smoke

# Informational only: not a required check. Builds the wheel, installs it in a clean venv as a
# user would (no constraints), and runs a small first-run smoke on Windows, macOS and Ubuntu.
# A red job is the intended signal; do not hide it with continue-on-error.
#
# Triggers: pushes to main and v1.0.15 (after each merge), PRs that touch any of the files below
# (never every task PR), nightly, and manual dispatch. `schedule` and `workflow_dispatch` only
# work once this file exists on the default branch (main); until then the pull_request trigger
# on the PR that changes this file is what exercises it.
on:
  push:
    branches: [main, v1.0.15]
  pull_request:
    branches: [main, 'v1.0.*']
    paths:
      - .github/workflows/platform-smoke.yml
      - scripts/check_wheel_imports.py
      - scripts/check_duckdb_lock_text.py
      - scripts/platform_smoke_init.py
      - scripts/first_user_journey.py
      - scripts/first_user_journey.ps1
      - scripts/journey_support.py
      - scripts/journey_services.py
      - scripts/journey_installer.py
      - pyproject.toml
      - install.ps1
      - install.sh
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  # Fixed throwaway value for the disposable smoke project; not a secret.
  DANGO_ADMIN_PASSWORD: "Smoke-Test-9xQ!pL3z"

jobs:
  smoke:
    name: Smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Worst case: steps before the journey (up to ~10 min on macos-15-intel) + journey budget
    # (12 min) + cleanup after the budget (~5 min) = ~27 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest # Apple Silicon (arm64)
            python-version: "3.12"
          - os: macos-15-intel # Intel (x64)
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Resolve venv paths
        run: |
          if [ "$RUNNER_OS" = Windows ]; then VBIN=Scripts; EXE=.exe; else VBIN=bin; EXE=; fi
          echo "FRESH_PY=$RUNNER_TEMP/fresh/$VBIN/python$EXE" >> "$GITHUB_ENV"
          echo "FRESH_DANGO=$RUNNER_TEMP/fresh/$VBIN/dango$EXE" >> "$GITHUB_ENV"
          echo "DEV_PY=$RUNNER_TEMP/dev/$VBIN/python$EXE" >> "$GITHUB_ENV"

      - name: Build wheel
        id: build
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          {
            echo "### Wheel (${{ matrix.os }})"
            python -c "import glob,hashlib; [print(hashlib.sha256(open(p,'rb').read()).hexdigest(), p) for p in glob.glob('dist/*.whl')]"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install wheel in a clean venv (no constraints, as a user would)
        id: install
        run: |
          python -m venv "$RUNNER_TEMP/fresh"
          "$FRESH_PY" -m pip install dist/*.whl
          "$FRESH_PY" -m pip check

      - name: dango --version
        id: version
        if: ${{ !cancelled() }}
        run: |
          "$FRESH_DANGO" --version

      - name: Import every dango module (from outside the workspace)
        id: imports
        if: ${{ !cancelled() }}
        run: |
          cd "$RUNNER_TEMP"
          "$FRESH_PY" "$GITHUB_WORKSPACE/scripts/check_wheel_imports.py"

      # Holds a DuckDB file in a second process and prints DuckDB's real lock message on this
      # platform, then checks that Dango's recogniser matches it (the Windows wording is the point).
      - name: DuckDB lock message (real two-process check)
        id: lock_text
        if: ${{ !cancelled() }}
        run: |
          cd "$RUNNER_TEMP"
          "$FRESH_PY" "$GITHUB_WORKSPACE/scripts/check_duckdb_lock_text.py" | tee "$RUNNER_TEMP/lock_text.out"
          rc=${PIPESTATUS[0]}
          {
            echo "### DuckDB lock message (${{ matrix.os }})"
            echo '```'
            cat "$RUNNER_TEMP/lock_text.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: dango init --skip-wizard (UTF-8)
        id: init_utf8
        if: ${{ !cancelled() }}
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/platform_smoke_init.py --dango "$FRESH_DANGO" \
            --workdir "$RUNNER_TEMP/init-utf8" --label "utf8 (${{ matrix.os }})"

      # Legacy code page: PYTHONUTF8=0 only. Expected to pass on UTF-8 Linux/macOS (UTF-8
      # locale) and to reproduce the cp1252 encoding failure on Windows.
      - name: dango init --skip-wizard (legacy cp1252 code page)
        id: init_cp1252
        if: ${{ !cancelled() }}
        env:
          PYTHONUTF8: "0"
        run: |
          python scripts/platform_smoke_init.py --dango "$FRESH_DANGO" \
            --workdir "$RUNNER_TEMP/init-cp1252" --label "cp1252 (${{ matrix.os }})"

      - name: Unit subset (local-logic tests from the checkout)
        id: unit
        if: ${{ !cancelled() }}
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
        run: |
          python -m venv "$RUNNER_TEMP/dev"
          "$DEV_PY" -m pip install -e ".[dev]"
          "$DEV_PY" -m pytest -p no:cacheprovider -q \
            tests/unit/test_dbt_lock_stale.py \
            tests/unit/test_marimo_local_token.py \
            tests/unit/test_config_loader.py \
            tests/unit/test_config_models.py \
            tests/unit/test_config_exceptions.py \
            tests/unit/test_config_credentials.py \
            tests/unit/test_scripts_config_env.py \
            tests/unit/test_schedules_config.py

      # The journey keeps file encodings at the platform default on purpose so encoding defects
      # surface; the dango children's console output is UTF-8 (PYTHONIOENCODING), as in a terminal.
      - name: First-user journey (init, source, sync, count, dbt, web, restart, second sync)
        id: journey
        if: ${{ !cancelled() }}
        env:
          JOURNEY_DOCKER: ${{ matrix.os == 'ubuntu-24.04' && '--with-docker' || '' }}
        run: |
          set +e
          python scripts/first_user_journey.py --dango "$FRESH_DANGO" \
            --workdir "$RUNNER_TEMP/journey" --log "$RUNNER_TEMP/journey.log" \
            --isolate-keyring --budget 720 $JOURNEY_DOCKER | tee "$RUNNER_TEMP/journey.out"
          rc=${PIPESTATUS[0]}
          {
            echo "### First-user journey (${{ matrix.os }})"
            echo '```'
            grep -E '^(PASS|FAIL|SKIP) ' "$RUNNER_TEMP/journey.out"
            echo '```'
            echo "Log tail:"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/journey.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Result summary
        if: always()
        run: |
          {
            echo "### Platform smoke: ${{ matrix.os }}"
            echo "- build wheel: ${{ steps.build.outcome }}"
            echo "- install wheel + pip check: ${{ steps.install.outcome }}"
            echo "- dango --version: ${{ steps.version.outcome }}"
            echo "- import every module: ${{ steps.imports.outcome }}"
            echo "- DuckDB lock message: ${{ steps.lock_text.outcome }}"
            echo "- init (UTF-8): ${{ steps.init_utf8.outcome }}"
            echo "- init (cp1252): ${{ steps.init_cp1252.outcome }}"
            echo "- unit subset: ${{ steps.unit.outcome }}"
            echo "- first-user journey: ${{ steps.journey.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The same first-user journey, started the way a real first user starts: the checkout's
  # install.sh (install.ps1 on Windows) installs the wheel built here, non-interactively
  # (DANGO_INSTALL_SPEC + DANGO_INSTALL_NONINTERACTIVE), into a clean folder; every later step
  # then uses the dango that installer put in its venv. A separate job so it runs in parallel and
  # keeps its own 30-minute worst case.
  installer:
    name: Installer journey (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Worst case: setup + wheel build (~5 min) + journey budget (15 min, the installer step
    # included) + cleanup after the budget (~5 min) = ~25 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest # Apple Silicon (arm64)
            python-version: "3.12"
          - os: macos-15-intel # Intel (x64)
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build wheel
        id: build
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          ls dist

      # Syntax check of the PowerShell scripts the installer journey and a person on a real
      # Windows device run. Each file is parsed twice: as `powershell -File` reads it (a file
      # without a BOM is read in the default code page, so non-ASCII text breaks Windows
      # PowerShell 5.1) and as the documented one-liner runs it (its UTF-8 text through iex).
      - name: Parse the PowerShell scripts
        if: ${{ matrix.os == 'windows-latest' && !cancelled() }}
        shell: powershell
        run: |
          foreach ($f in 'scripts/first_user_journey.ps1', 'install.ps1') {
            $path = (Resolve-Path $f).Path
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { "$f (as -File) : $_" }; exit 1 }
            $text = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { "$f (as UTF-8 text) : $_" }; exit 1 }
            "parsed $f"
          }

      # A stopped installer must hand back its exit code from a script file and from a one-shot
      # `powershell -Command`, and must NOT end an interactive PowerShell session when the text runs
      # through iex (exit would close the person's window). -NoExit stands in for the interactive
      # window here.
      - name: Installer stop behaviour (exit code, window stays open)
        if: ${{ matrix.os == 'windows-latest' && !cancelled() }}
        shell: powershell
        run: |
          $env:DANGO_INSTALL_SPEC = '-bad'
          powershell -NoProfile -File install.ps1
          if ($LASTEXITCODE -ne 1) { "as -File: expected exit code 1, got $LASTEXITCODE"; exit 1 }
          powershell -NoProfile -Command 'iex ([System.IO.File]::ReadAllText((Resolve-Path install.ps1).Path, [System.Text.Encoding]::UTF8))'
          if ($LASTEXITCODE -ne 1) { "as a one-shot -Command: expected exit code 1, got $LASTEXITCODE"; exit 1 }
          $out = powershell -NoProfile -NoExit -Command 'iex ([System.IO.File]::ReadAllText((Resolve-Path install.ps1).Path, [System.Text.Encoding]::UTF8)); Write-Output session-still-open:$LASTEXITCODE; exit 0'
          $out
          if (-not ($out -match 'session-still-open:1')) { "as an interactive iex: the session ended or lost the exit code"; exit 1 }

      - name: First-user journey through the installer
        id: journey
        if: ${{ !cancelled() }}
        run: |
          set +e
          python scripts/first_user_journey.py --installer --spec "$(ls dist/*.whl)" \
            --workdir "$RUNNER_TEMP/journey" --log "$RUNNER_TEMP/journey.log" \
            --isolate-keyring --budget 900 | tee "$RUNNER_TEMP/journey.out"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::group::Journey log (first 200 lines)"
            head -n 200 "$RUNNER_TEMP/journey.log"
            echo "::endgroup::"
          fi
          {
            echo "### Installer journey (${{ matrix.os }})"
            echo '```'
            grep -E '^(PASS|FAIL|SKIP) ' "$RUNNER_TEMP/journey.out"
            echo '```'
            echo "Log tail:"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/journey.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Result summary
        if: always()
        run: |
          {
            echo "### Installer smoke: ${{ matrix.os }}"
            echo "- build wheel: ${{ steps.build.outcome }}"
            echo "- installer journey: ${{ steps.journey.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The installer in clean Linux containers, as a first user on those systems would run it: the
  # checkout's install.sh installs the wheel built here, non-interactively, and the dango it put in
  # its virtual environment starts. Ubuntu 22.04 ships Python 3.10, so it gets the 3.11 packages
  # from its own repositories first.
  installer-containers:
    name: Installer in a ${{ matrix.image }} container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            packages: python3.11 python3.11-venv
          - image: debian:12
            packages: python3 python3-venv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          ls dist

      - name: Run the installer in the container
        env:
          IMAGE: ${{ matrix.image }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          docker run --rm -v "$PWD":/repo:ro -v "$PWD/dist":/dist:ro \
            -e PACKAGES -e DEBIAN_FRONTEND=noninteractive "$IMAGE" bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq $PACKAGES > /dev/null
              mkdir /work && cd /work
              DANGO_INSTALL_SPEC="$(ls /dist/*.whl)" DANGO_INSTALL_NONINTERACTIVE=1 \
                DANGO_INSTALL_DOCKER_CONTINUE=y DANGO_INSTALL_MODE=1 DANGO_INSTALL_SETUP=1 \
                bash /repo/install.sh
              /work/venv/bin/dango --version
            '
