name: CI

on:
  push:
    branches: [v1, main]
  pull_request:
    branches: [v1, main, 'v1.0.*']

jobs:
  css:
    name: CSS build (tailwind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Build CSS
        run: make css-build
      - name: Check no drift
        run: git diff --exit-code dango/web/static/css/tailwind.min.css

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - name: mypy
        run: mypy dango/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - name: pytest
        env:
          DANGO_LOG_LEVEL: ERROR
        # -m "not egress": the egress-marked test needs the spaCy PII model
        # pre-installed to stay hermetic (see the egress job's dedicated
        # pre-install step below) — this matrix doesn't have that step, so
        # running it here would add a live GitHub Releases download
        # dependency to these required checks for no benefit; the egress
        # job already covers it.
        run: pytest --tb=short -q -m "not egress"${{ matrix.python-version == '3.12' && ' --cov=dango --cov-report=term --cov-fail-under=72' || '' }}
      # Non-blocking on purpose (the one allowed continue-on-error). Trigger to make it
      # blocking (drop continue-on-error, add --fail-on-hits): the count is 0 after this PR.
      - name: Assertion-less tests
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: python scripts/find_assertionless_tests.py --fail-on-hits tests

  security:
    name: Security (pip-audit)
    # Blocks merges. Accepted advisories live, with expiry dates, in
    # .github/pip-audit-ignores.txt (checked by scripts/check_audit_ignores.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - name: pip-audit
        run: scripts/run_pip_audit.sh

  sast:
    name: SAST (bandit)
    # The checker counts occurrences; Bandit's built-in baseline can hide a new
    # instance of the same finding in an already-listed file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "bandit[toml]==1.9.4"
      - name: bandit
        run: python scripts/check_bandit_baseline.py

  egress:
    name: Egress allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - name: Pre-install spaCy PII model
        # Real download, done here (unguarded) so the guarded test below is
        # hermetic — spacy.load() succeeds without any network call once this
        # is installed. Without this step, the live-detection test's PII scan
        # hook falls through to governance/pii_detector.py's urllib fallback
        # and either does a slow live download or gets correctly blocked as
        # an "unexpected host" (it isn't unexpected, it's just not pre-empted).
        run: python -m spacy download en_core_web_sm
      - name: Egress allowlist test
        run: pytest tests/unit/test_egress_allowlist.py -v

  llm-checks:
    name: LLM checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: File sizes
        run: python3 scripts/check_file_sizes.py --all

      - name: CLAUDE.md structure
        continue-on-error: true
        run: python3 scripts/validate_claude_md.py --recursive

      - name: File headers
        run: python3 scripts/validate_headers.py --all

      - name: Docstring coverage
        run: python3 scripts/check_docstrings.py --all

      - name: Orphan files
        continue-on-error: true
        run: python3 scripts/check_orphan_files.py

      - name: Pinned deps
        continue-on-error: true
        run: python3 scripts/check_pinned_deps.py
