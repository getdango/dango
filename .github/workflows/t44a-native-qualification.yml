name: T44A native qualification diagnostic

on:
  pull_request:
    branches: [v1.1.0]
    paths:
      - .github/workflows/t44a-native-qualification.yml
      - tests/integration/t44a_qualification/**

permissions:
  contents: read

concurrency:
  group: t44a-native-qualification
  cancel-in-progress: false

jobs:
  dbt-driver:
    if: >-
      github.repository == 'getdango/dango' &&
      github.event.pull_request.head.repo.full_name == 'getdango/dango' &&
      github.event.pull_request.head.ref == 'test/t44a-full-native-03'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 00177c877757be1ed3bb3992eb4290c222e197d2
          persist-credentials: false
          path: baseline
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fresh running Python smoke and real offline dbt diagnostic
        run: |
          env -i PATH="$PATH" PROBE_HEAD="$GITHUB_SHA" python candidate/tests/integration/t44a_qualification/run.py "$RUNNER_TEMP/t44a03" "$GITHUB_WORKSPACE/baseline"
      - name: Measured full development acquisition only, no install or build
        run: |
          env -i PATH="$PATH" python candidate/tests/integration/t44a_qualification/app_acquire.py "$RUNNER_TEMP/t44a03" "$GITHUB_WORKSPACE/baseline"
      - name: Fresh populated installer smoke, offline install and complete normal app build
        run: |
          env -i PATH="$PATH" python candidate/tests/integration/t44a_qualification/app_build.py "$RUNNER_TEMP/t44a03" "$GITHUB_WORKSPACE/baseline"
      - name: Fresh runtime profiles, real S3 and first ordinary full-app slice
        run: |
          env -i PATH="$PATH" python candidate/tests/integration/t44a_qualification/app_runtime.py "$RUNNER_TEMP/t44a03" "$GITHUB_WORKSPACE/baseline"
      - name: Publish only sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t44a-native-diagnostic
          path: |
            ${{ runner.temp }}/t44a03/evidence/result.json
            ${{ runner.temp }}/t44a03/evidence/commands.json
            ${{ runner.temp }}/t44a03/evidence/diagnostic.json
            ${{ runner.temp }}/t44a03/evidence/manifest.json
            ${{ runner.temp }}/t44a03/evidence/run_results.json
            ${{ runner.temp }}/t44a03/evidence/catalog.json
            ${{ runner.temp }}/t44a03/evidence/dbt-view.json
            ${{ runner.temp }}/t44a03/evidence/view-manifest.json
            ${{ runner.temp }}/t44a03/evidence/view-run_results.json
            ${{ runner.temp }}/t44a03/evidence/view-catalog.json
            ${{ runner.temp }}/t44a03/evidence/app-acquisition.json
            ${{ runner.temp }}/t44a03/evidence/app-package-inventory.json
            ${{ runner.temp }}/t44a03/evidence/app-build.json
            ${{ runner.temp }}/t44a03/evidence/license-resolutions.json
            ${{ runner.temp }}/t44a03/evidence/app-runtime.json
            ${{ runner.temp }}/t44a03/evidence/app-slice.json
            ${{ runner.temp }}/t44a03/evidence/garage-LICENSE.txt
          if-no-files-found: error
          retention-days: 7
